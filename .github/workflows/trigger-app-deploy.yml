name: Rebuild via.inputzen.com on definition change

on:
  push:
    branches: [via-keyboards-buildbox]
    paths: ['v3/**', 'src/**', 'scripts/**']
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "::error::CF_DEPLOY_HOOK_URL secret is missing"; exit 1; }
          curl -fsS -X POST "$HOOK"
