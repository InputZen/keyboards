name: Rebuild web app on definition change

on:
  push:
    branches: [via-keyboards-buildbox]
    paths:
      - 'v3/**'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Start the cPanel deploy in kiwikey/via-app
        env:
          TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::The secret APP_DISPATCH_TOKEN is missing or empty in this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/kiwikey/via-app/actions/workflows/deploy-to-cpanel.yml/dispatches \
            -d '{"ref":"via-app-buildbox"}')
          echo "GitHub answered HTTP $code"
          cat response.json
          echo
          case "$code" in
            204) echo "Deploy started in kiwikey/via-app." ;;
            401) echo "::error::401: the token is invalid or expired."; exit 1 ;;
            403|404) echo "::error::$code: the token cannot use Actions on kiwikey/via-app (needs permission Actions: Read and write for that repository)."; exit 1 ;;
            422) echo "::error::422: the workflow has no workflow_dispatch trigger on branch via-app-buildbox, or the branch name is wrong."; exit 1 ;;
            *) echo "::error::Unexpected answer $code."; exit 1 ;;
          esac
